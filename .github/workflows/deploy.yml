name: Build and Deploy ProfitHub

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: profithub-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_PUBLIC_PATH: /
          VITE_ROUTER_HISTORY: hash

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 63022 -H rdp.luulyuan.cc >> ~/.ssh/known_hosts

      - name: Deploy static files
        run: >-
          rsync -az --delete
          -e "ssh -p 63022"
          dist/
          radxa@rdp.luulyuan.cc:/home/radxa/apps/profithub/site/
